services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: rag-pgvector
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${RAG_POSTGRES_DB}
      POSTGRES_USER: ${RAG_POSTGRES_USER}
      POSTGRES_PASSWORD: ${RAG_POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --encoding=UTF8
    volumes:
      - rag_pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  rag_pgvector_data:
