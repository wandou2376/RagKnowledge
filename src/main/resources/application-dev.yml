spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/${RAG_POSTGRES_DB:ragdb}
    username: ${RAG_POSTGRES_USER:rag_app}
    password: ${RAG_POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    create-schemas: true
    schemas: rag
    default-schema: rag
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: rag
    open-in-view: false
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com
      chat:
        options:
          # 官方当前的模型名。旧的 deepseek-v4-flash-vision-exp 已标记为 legacy，会转发到 DeepSeek-V4.1-Flash
          model: deepseek-flash
          temperature: 0.2

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  data:
    redis:
      # Docker 里的 Redis 映射到 6380，避免和本机原生的 6379 撞端口
      host: localhost
      port: 6380
      # 必须显式设超时：Lettuce 默认命令超时是 60 秒，
      # Redis 挂掉时读一次、写一次会话历史会各等 60 秒，请求直接不可用。
      # 会话记忆是增强能力，宁可快速降级为「没有历史」也不要让用户等两分钟。
      timeout: 2s
      connect-timeout: 1s

app:
  storage:
    local-path: storage/documents
    max-file-size-bytes: 52428800
  chunking:
    # 单个分块的目标大小（token），建议 500~800
    target-tokens: 600
    # 相邻分块的重叠 token 数
    overlap-tokens: 80
    # 尾块小于该值时并入上一块
    min-chunk-tokens: 120
    # 同一行出现在多大比例的页面上就判定为页眉页脚
    boilerplate-page-ratio: 0.6
    # 页数少于该值时不做页眉页脚剔除
    boilerplate-min-pages: 3
  embedding:
    # 硅基流动的 OpenAI 兼容接口，提供 BAAI/bge-m3。DeepSeek 不提供 Embedding 接口，必须外挂一家。
    # 注意这里不带 /v1：Spring AI 会自己在 base URL 后面拼 /v1/embeddings，
    # 而官方文档给的 https://api.siliconflow.cn/v1 是按 OpenAI 官方 SDK 的约定写的，
    # 直接抄过来会请求到 /v1/v1/embeddings 并返回 404。
    base-url: https://api.siliconflow.cn
    # 留空时应用仍能启动，只有在真正调用向量化接口时才会报错，方便先跑通上传和解析
    api-key: ${SILICONFLOW_API_KEY:}
    model: BAAI/bge-m3
    # 必须与 V5 迁移里 embedding vector(N) 的 N 一致，启动后第一次向量化时也会校验
    dimension: 1024
    # 单次请求最多提交多少个分块，避免触发服务端的批量上限
    batch-size: 16
  chat:
    memory:
      # 每次提问最多带上多少轮历史对话（一轮 = 提问 + 回答），避免上下文无限增长
      max-turns: 5
      # 会话的过期时间，滑动续期：每次追加消息都会重置
      ttl: 7d

logging:
  level:
    # 开发环境打开本项目包的 DEBUG，能看到每一步的细节（逐页提取、逐块生成等）。
    # 嫌吵就把这一行删掉，只保留 INFO 级别的操作日志。
    com.itdou.ragknowledgesystem: DEBUG
